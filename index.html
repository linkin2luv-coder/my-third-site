<!DOCTYPE html>
<html>
<head>
  <title>My Third page now using desktop</title>
  <style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: white;
    text-align: center;
    padding: 40px;
  }
  h1 {
    color: black;
  }

  /* 1 - COLOUR: Real Microsoft Purple */
  button {
    background: #5c2d91;
    color: white;
    border: none;

    /* 4 - SPACE INSIDE: Make button no choke */
    padding: 8px 16px;
    font-size: 16px;

    /* 3 - ROUND CORNER: 8px */
    border-radius: 8px;
    cursor: pointer;
  }

  /* 2 - HOVER: When mouse touch am, e go dark purple */
  button:hover {
    background: #32145a;
  }
</style>
</head>
<body>
  <h1>My third page for practice now using desktop!</h1>
  <p>I dey learn HTML for Lagos.</p>
  <button>Click Me</button>
</body>
</html>
